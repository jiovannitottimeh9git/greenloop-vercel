<section class="dash-panel" id="drivers"><div class="panel-heading"><div><span class="form-step">DRIVER MANAGEMENT</span><h2>Register a driver</h2></div><span class="live-label">Admin controlled access</span></div><p class="map-note">Create accounts for approved drivers. They will sign in with their email address and the password you set here.</p><form id="createDriverForm" class="driver-create-form"><label>Full name<input type="text" name="full_name" placeholder="e.g. Kwame Mensah" maxlength="120" required></label><label>Email address<input type="email" name="email" placeholder="driver@example.com" maxlength="160" required></label><label>Phone number<input type="tel" name="phone" placeholder="e.g. 0241234567" maxlength="30" pattern="[0-9+()\s-]{9,18}" title="Enter a valid Ghana phone number" required></label><label>Driver licence number <span class="optional-label">(optional)</span><input type="text" name="licence_number" placeholder="Licence number" maxlength="80"></label><label>Temporary password<input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></label><button class="btn btn-primary" type="submit">Create driver account <i class="fa-solid fa-user-plus"></i></button></form><div id="driverCreateMessage" class="form-message" aria-live="polite"></div></section>
<section class="dash-panel"><div class="panel-heading"><div><span class="form-step">REGISTERED TEAM</span><h2>Driver accounts</h2></div><button class="btn btn-outline btn-small refresh-btn" id="refreshDrivers" type="button" title="Reload the driver accounts list"><i class="fa-solid fa-rotate"></i> <span>Refresh drivers</span></button></div><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Contact</th><th>Licence</th><th>Active jobs</th><th>Account status</th><th>Action</th></tr></thead><tbody id="driverRows"><tr><td colspan="6">Loading drivers…</td></tr></tbody></table></div><div id="driverListMessage" class="form-message" aria-live="polite"></div></section>
